name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.PERFILA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: perfila-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # ---------- Release firmado (solo si existen los secretos de la llave) ----------
      - name: Restore upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.PERFILA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/perfila-upload.jks"

      - name: Build signed release (APK + AAB)
        if: env.HAS_KEYSTORE == 'true'
        env:
          PERFILA_KEYSTORE_PATH: ${{ runner.temp }}/perfila-upload.jks
          PERFILA_KEYSTORE_PASSWORD: ${{ secrets.PERFILA_KEYSTORE_PASSWORD }}
          PERFILA_KEY_ALIAS: ${{ secrets.PERFILA_KEY_ALIAS }}
          PERFILA_KEY_PASSWORD: ${{ secrets.PERFILA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify APK signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: perfila-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Play Store bundle (AAB)
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: perfila-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/perfila-upload.jks"

      # ---------- Publicar versión en GitHub Releases al crear un tag vX.Y.Z ----------
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
